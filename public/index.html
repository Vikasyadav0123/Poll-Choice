<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Poll App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="card">

            <strong>Question</strong>
            <input id="questionInput" placeholder="Enter your poll question">

            <strong class="mt-3">Answer Options</strong>
            <div id="optionsContainer"></div>

            <strong class="mt-3">Poll Duration</strong>
            <input id="expiryInput" type="number" min="1" placeholder="Expiry time in minutes (e.g., 10)" value="10">

            <div id="actionBar">
                <button type="button" class="start-btn" onclick="confirmAndStartPoll()">
                    Start Poll
                </button>

                <button class="reset-btn" onclick="resetPoll()">Reset</button>
            </div>

            <!-- Output container for success message and share links -->
            <div id="output"></div>

        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h3>Confirm Poll Creation</h3>
            <div id="confirmDetails"></div>
            <div class="modal-actions">
                <button class="start-btn" onclick="proceedWithPoll()">Yes, Create Poll</button>
                <button class="reset-btn" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
